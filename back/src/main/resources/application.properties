spring.application.name=nfc-tag-service
server.port=${PORT:8080}

#Database Connection (Supabase Session Pooler)
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.properties.hibernate.default_schema=nfc
#??? ?? (?? DBeaver?? ?? ??? ??)


supabase.url=${SUPABASE_URL:}
supabase.service-key=${SUPABASE_SERVICE_KEY:}
supabase.bucket-name=${SUPABASE_BUCKET_NAME:tag-images}


#JPA & Hibernate ??
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect


spring.profiles.default=local

# Admin authentication
security.jwt.expiration=PT8H
