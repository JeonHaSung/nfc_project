app.server-domain=http://localhost:8080
security.jwt.secret=${JWT_SECRET:nfc-admin-local-development-secret-change-me-0123456789abcdef}
security.cookie.secure=false

spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.properties.hibernate.default_schema=retap

supabase.url=${SUPABASE_URL:}
supabase.service-key=${SUPABASE_SERVICE_KEY:}
supabase.bucket-name=${SUPABASE_BUCKET_NAME:tag-images}
