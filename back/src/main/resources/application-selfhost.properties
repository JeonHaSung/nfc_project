# PC admin behind Caddy: https://fullkiths.duckdns.org/retapnfc -> 127.0.0.1:8081
# Card and public URLs always use the production domain, same database as prod.
app.server-domain=https://retapnfc.com
server.port=${PORT:8081}
server.address=127.0.0.1
server.servlet.context-path=${APP_CONTEXT_PATH:/retapnfc}
server.forward-headers-strategy=framework
security.jwt.secret=${JWT_SECRET}
security.cookie.secure=true

# Low-spec embedded Tomcat
server.tomcat.threads.max=20
server.tomcat.threads.min-spare=5
server.tomcat.max-connections=100
server.tomcat.accept-count=50
server.tomcat.connection-timeout=20s

# Low-spec DB pool
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=600000

spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.properties.hibernate.default_schema=nfc
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.open-in-view=false
spring.main.banner-mode=off

server.compression.enabled=true
server.compression.mime-types=text/html,text/xml,text/plain,text/css,text/javascript,application/javascript,application/json,application/problem+json
server.compression.min-response-size=1024

supabase.url=${SUPABASE_URL:}
supabase.service-key=${SUPABASE_SERVICE_KEY:}
supabase.bucket-name=${SUPABASE_BUCKET_NAME:tag-images}
